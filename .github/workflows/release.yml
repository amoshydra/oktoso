name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify npm supports trusted publishing
        run: |
          version="$(npm --version)"
          node - "$version" <<'NODE'
          const [major, minor, patch] = process.argv[2].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            console.error(`npm ${process.argv[2]} is too old for trusted publishing; npm >= 11.5.1 is required`);
            process.exit(1);
          }
          console.log(`npm ${process.argv[2]} supports trusted publishing`);
          NODE

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm openapi:check
      - run: pnpm build:single-port
      - run: npm pack --dry-run

      # No NODE_AUTH_TOKEN is configured. npm obtains the short-lived OIDC
      # credential from GitHub when the package has a trusted publisher entry.
      - name: Publish with provenance
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NPM_CONFIG_PROVENANCE: "true"
