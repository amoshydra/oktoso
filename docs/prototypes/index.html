<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Agent Hub · UI prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app view-inbox" id="app">
      <nav class="rail" id="rail" aria-label="Primary"></nav>
      <aside class="sidebar" id="sidebar" aria-label="Sessions"></aside>
      <main class="main" id="main"></main>
      <aside class="details" id="details" aria-label="Session details"></aside>
      <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="modal-backdrop" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
