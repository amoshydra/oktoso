        "200":
          description: Push subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionPage"
    post:
      tags:
        - notifications
      summary: Register a push subscription
      requestBody:
        required: true
        content:
