        - kind
        - choices
        - choice
        - label
        - createdAt
        - uses
    AutomationView:
      type: object
      properties:
        enabled:
          type: boolean
        paused:
          type: boolean
        dryRun:
          type: boolean
        watchers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[a-zA-Z0-9._-]+$
              name:
                type: string
                minLength: 1
                maxLength: 80
              enabled:
                type: boolean
                default: true
              trigger:
                oneOf:
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - attention
                      types:
                        type: array
                        items:
                          type: string
                          enum:
                            - permission
                            - approval
                            - question
                            - unread
                            - error
                        minItems: 1
                        default:
                          - question
                    required:
                      - kind
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - session
                      on:
                        type: string
                        enum:
                          - idle
                          - error
                      idleMs:
                        type: integer
                        minimum: 0
                        maximum: 86400000
                        default: 60000
                    required:
                      - kind
                      - on
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - schedule
                      everyMs:
                        type: integer
                        minimum: 60000
                        maximum: 86400000
                    required:
                      - kind
                      - everyMs
              condition:
                type: object
                properties:
                  providerID:
                    type: string
                    minLength: 1
                  sessionRef:
                    type: string
                    minLength: 1
                  titleContains:
                    type: string
                    minLength: 1
                    maxLength: 120
              action:
                oneOf:
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - answer
                      choice:
                        type: string
                        enum:
                          - first-safe
                          - id
                          - label
                        default: first-safe
                      value:
                        type: string
                        minLength: 1
                    required:
                      - kind
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - escalate
                    required:
                      - kind
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - notify
                    required:
                      - kind
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - retry
                    required:
                      - kind
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - start
                      template:
                        type: string
                        minLength: 1
                    required:
                      - kind
                      - template
              dryRun:
                type: boolean
                default: true
              limits:
                type: object
                properties:
                  maxActionsPerHour:
                    type: integer
                    minimum: 1
                    maximum: 1000
                    default: 6
                  maxActionsPerDay:
                    type: integer
                    minimum: 1
                    maximum: 10000
                    default: 24
                default:
                  maxActionsPerHour: 6
                  maxActionsPerDay: 24
            required:
              - id
              - trigger
              - action
        templates:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[a-zA-Z0-9._-]+$
              name:
                type: string
                minLength: 1
                maxLength: 80
              providerID:
                type: string
                minLength: 1
              title:
                type: string
                minLength: 1
                maxLength: 120
              directory:
                type: string
                minLength: 1
              agent:
                type: string
                minLength: 1
              model:
                type: string
                minLength: 1
              text:
                type: string
                minLength: 1
            required:
              - id
              - providerID
              - title
          default: []
        pausedWatchers:
          type: array
          items:
            type: string
        runs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              watcherID:
                type: string
              trigger:
                type: string
              decision:
                type: string
                enum:
                  - acted
                  - escalated
                  - dry_run
                  - skipped
                  - failed
              reason:
                type: string
              sessionRef:
                type: string
              attentionID:
                type: string
              action:
                type: string
              detail:
                type: string
              at:
                type: integer
              approved:
                type: boolean
            required:
              - id
              - watcherID
              - trigger
              - decision
              - reason
              - at
        approvals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              watcherID:
                type: string
              attentionID:
                type: string
              sessionRef:
                type: string
              title:
                type: string
              summary:
                type: string
              action:
                oneOf:
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - answer
                      choice:
                        type: string
                        enum:
                          - first-safe
                          - id
                          - label
                        default: first-safe
                      value:
                        type: string
                        minLength: 1
                    required:
                      - kind
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - escalate
                    required:
                      - kind
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - notify
                    required:
                      - kind
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - retry
                    required:
                      - kind
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - start
                      template:
                        type: string
                        minLength: 1
                    required:
                      - kind
                      - template
              reason:
                type: string
              status:
                type: string
                enum:
                  - pending
                  - approved
                  - denied
                  - expired
              createdAt:
                type: integer
              expiresAt:
                type: integer
              decidedAt:
                type: integer
              actionable:
                type: boolean
              proposed:
                type: object
                properties:
                  label:
                    type: string
                    maxLength: 80
                  text:
                    type: string
                    maxLength: 500
                required:
                  - text
              allowShape:
                type: boolean
            required:
              - id
              - watcherID
              - attentionID
              - sessionRef
              - title
              - summary
              - action
              - reason
              - status
              - createdAt
              - expiresAt
              - actionable
              - allowShape
        allowedShapes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              watcherID:
                type: string
              kind:
                type: string
                enum:
                  - boolean
                  - choice
              choices:
                type: array
                items:
                  type: string
              choice:
                type: string
              label:
                type: string
              createdAt:
                type: integer
              lastUsedAt:
                type: integer
              uses:
                type: integer
                minimum: 0
            required:
              - id
              - watcherID
              - kind
              - choices
              - choice
              - label
              - createdAt
              - uses
      required:
        - enabled
        - paused
        - dryRun
        - watchers
        - pausedWatchers
        - runs
        - approvals
        - allowedShapes
    AutomationSettingsInput:
      type: object
      properties:
        paused:
          type: boolean
        dryRun:
          type: boolean
    AutomationApprovalAction:
      type: string
      enum:
        - approve
        - deny
        - always
  parameters: {}
paths:
  /api/v1/health:
    get:
      tags:
        - health
      summary: Hub liveness
      security: []
      responses:
        "200":
          description: Hub is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/check:
    get:
      tags:
        - auth
      summary: Check the hub credential
      description: Accepts the owner bearer token, a paired session bearer token, or a paired session cookie.
      responses:
        "200":
          description: Credential accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCheck"
        "401":
          description: Missing or invalid hub credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/pair:
    post:
      tags:
        - auth
      summary: Create a pairing code
      description: Create a short-lived, single-use code for a /pair/{code} pairing link. Requires the owner credential.
      responses:
        "200":
          description: Pairing code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
        "401":
          description: Missing or invalid hub credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A session credential cannot create pairing codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/connect:
    post:
      tags:
        - auth
      summary: Redeem a pairing code
      description: Redeem a pairing code for a session token. This is the machine exchange; browser pairing uses the GET/POST /pair/{code} page so link previews cannot consume the code. Codes work once and expire after five minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingExchange"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingSession"
        "400":
          description: A JSON body with a pairing code is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Pairing link expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh a session token
      description: Issue a fresh 30-day session token for a valid paired session. The owner token never expires and is rejected here. Old stateless tokens remain valid until their original expiry.
      responses:
        "200":
          description: Refreshed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRefresh"
        "400":
          description: The owner token does not expire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid hub credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/signout:
    post:
      tags:
        - auth
      summary: Clear the session cookie
      description: Clears the paired browser cookie. Stateless session tokens remain valid until they expire or the owner token rotates.
      security: []
      responses:
        "204":
          description: Cookie cleared
  /api/v1/providers:
    get:
      tags:
        - providers
      summary: List configured providers
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
                required:
                  - data
    post:
      tags:
        - providers
      summary: Add a provider
      description: Adds a provider to the hub config, hot-loads its adapter, invalidates provider caches, and returns the provider with its latest health status. Credentials are write-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Provider added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Provider"
                required:
                  - data
        "400":
          description: Invalid provider input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Provider ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider management is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/providers/{providerID}:
    put:
      tags:
        - providers
      summary: Update a provider
      description: Updates a provider in the hub config and hot-loads its adapter. Omit the secret to keep the existing credential.
      parameters:
        - schema:
            type: string
          required: true
          name: providerID
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdateInput"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Provider"
                required:
                  - data
        "400":
          description: Invalid provider input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider management is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/providers/{providerID}/check:
    post:
      tags:
        - providers
      summary: Check provider health
      parameters:
        - schema:
            type: string
          required: true
          name: providerID
          in: path
      responses:
        "200":
          description: Health result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealth"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/providers/{providerID}/options:
    get:
      tags:
        - providers
      summary: List provider creation options
      parameters:
        - schema:
            type: string
          required: true
          name: providerID
          in: path
      responses:
        "200":
          description: Provider options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderOptions"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider does not expose options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sessions:
    get:
      tags:
        - sessions
      summary: List sessions across providers
      parameters:
        - schema:
            type: string
          required: false
          name: provider
          in: query
        - schema:
            type: string
            enum:
              - all
              - root
          required: false
          name: scope
          in: query
        - schema:
            type: string
            enum:
              - running
              - idle
              - error
              - offline
          required: false
          name: status
          in: query
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 200
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Session page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - sessions
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sessions/{ref}:
    get:
      tags:
        - sessions
      summary: Get one session
      parameters:
        - schema:
            type: string
          required: true
          name: ref
          in: path
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - sessions
      summary: Rename a session
      parameters:
        - schema:
            type: string
          required: true
          name: ref
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRenameInput"
      responses:
        "200":
          description: Renamed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider does not support renaming sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sessions/{ref}/selection:
    post:
      tags:
        - sessions
      summary: Change the session model or agent
      parameters:
        - schema:
            type: string
          required: true
          name: ref
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionSelectionInput"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider does not support changing the selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sessions/{ref}/messages:
    get:
      tags:
        - sessions
      summary: List session messages
      parameters:
        - schema:
            type: string
          required: true
          name: ref
          in: path
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 200
          required: false
          name: limit
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
          required: false
          name: order
          in: query
      responses:
        "200":
          description: Message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - sessions
      summary: Send a prompt
      parameters:
        - schema:
            type: string
          required: true
          name: ref
          in: path
        - schema:
            type: string
          required: false
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInput"
      responses:
        "202":
          description: Prompt accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendResult"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Question changed or already answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sessions/{ref}/inbox:
    get:
      tags:
        - sessions
      summary: List queued provider messages
      parameters:
        - schema:
            type: string
          required: true
          name: ref
          in: path
      responses:
        "200":
          description: Queued messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxPage"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider does not expose an inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sessions/{ref}/inbox/{itemId}:
    patch:
      tags:
        - sessions
      summary: Change the delivery mode of a queued message
      parameters:
        - schema:
            type: string
          required: true
          name: ref
          in: path
        - schema:
            type: string
          required: true
          name: itemId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxDeliveryInput"
      responses:
        "204":
          description: Delivery updated
        "400":
          description: Invalid delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session or queued message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider cannot change queued delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - sessions
      summary: Cancel a queued message
      parameters:
        - schema:
            type: string
          required: true
          name: ref
          in: path
        - schema:
            type: string
          required: true
          name: itemId
          in: path
      responses:
        "204":
          description: Queued message removed
        "404":
          description: Session or queued message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider cannot cancel queued messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sessions/{ref}/export:
    get:
      tags:
        - sessions
      summary: Export a session transcript
      description: Markdown or JSON download of one session and its transcript. Attachment files are listed, not embedded. The hub reads the transcript from the provider.
      parameters:
        - schema:
            type: string
          required: true
          name: ref
          in: path
        - schema:
            type: string
            enum:
              - md
              - json
          required: false
          name: format
          in: query
      responses:
        "200":
          description: Exported transcript
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/settings/local-data:
    get:
      tags:
        - settings
      summary: Read local data counts and retention
      responses:
        "200":
          description: Local data view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LocalDataView"
                required:
                  - data
    put:
      tags:
        - settings
      summary: Set per-store retention
      description: Retention is per store; `0` means never prune. Drafts default to never so unsent work is not deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalRetentionInput"
      responses:
        "200":
          description: Updated local data view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LocalDataView"
                required:
                  - data
        "400":
          description: Invalid retention settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - settings
      summary: Clear all local data
      description: Clears drafts, read markers, reply feedback, the transcript cache, and its search index. Providers are untouched.
      responses:
        "200":
          description: Cleared local data view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LocalDataView"
                required:
                  - data
