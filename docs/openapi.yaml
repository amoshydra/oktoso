                  - data
        "400":
          description: Invalid or unsupported audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Transcription is disabled or unconfigured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Audio is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Transcription endpoint failed
