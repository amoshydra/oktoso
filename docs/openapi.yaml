openapi: 3.1.0
info:
  title: Oktoso API
  version: 0.2.0
  description: Hub API for sessions, drafts, messages, attention, provider options, diagnostics, and a resumable event stream.
servers:
  - url: http://127.0.0.1:8787
    description: Local hub
tags:
  - name: health
  - name: auth
  - name: providers
  - name: sessions
  - name: attachments
  - name: drafts
  - name: questions
  - name: attention
  - name: replies
  - name: settings
  - name: transcription
  - name: events
  - name: search
  - name: notifications
  - name: automation
  - name: assistant
  - name: diagnostics
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            requestId:
              type: string
            details:
              type: object
              additionalProperties: {}
          required:
            - code
            - message
            - retryable
      required:
        - error
    Cursor:
      type: object
      properties:
        next:
          type:
            - string
            - "null"
        previous:
          type:
            - string
            - "null"
      required:
        - next
    Health:
      type: object
      properties:
        ok:
          type: boolean
        version:
          type: string
        pid:
          type: integer
          exclusiveMinimum: 0
        uptimeMs:
          type: integer
          minimum: 0
        startedAt:
          type: integer
        eventSeq:
          type: integer
          minimum: 0
      required:
        - ok
        - version
        - pid
        - uptimeMs
        - startedAt
        - eventSeq
    AuthKind:
      type: string
      enum:
        - owner
        - session
    AuthCheck:
      type: object
      properties:
        ok:
          type: boolean
        version:
          type: string
        auth:
          type: object
          properties:
            kind:
              type: string
              enum:
                - owner
                - session
            expiresAt:
              type: integer
              description: Unix epoch milliseconds for a paired session
          required:
            - kind
      required:
        - ok
        - version
    PairingCode:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        expiresIn:
          type: integer
          minimum: 0
          description: Seconds until the pairing code expires
        expiresAt:
          type: integer
          description: Unix epoch milliseconds when the pairing code expires
      required:
        - code
        - expiresIn
        - expiresAt
    PairingSession:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        expiresAt:
          type: integer
          description: Unix epoch milliseconds when the session token expires
      required:
        - token
        - expiresAt
    PairingExchange:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Single-use pairing code
      required:
        - code
    SessionRefresh:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        expiresAt:
          type: integer
          description: Unix epoch milliseconds when the refreshed session expires
      required:
        - token
        - expiresAt
    Diagnostics:
      type: object
      properties:
        version:
          type: string
        node:
          type: string
        uptimeMs:
          type: integer
          minimum: 0
        startedAt:
          type: integer
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              type:
                type: string
              status:
                type: string
                enum:
                  - online
                  - offline
                  - auth-error
                  - unknown
              lastCheckedAt:
                type: integer
              lastSyncAt:
                type: integer
              lastError:
                type: string
              nextRetryAt:
                type: integer
            required:
              - id
              - type
              - status
        events:
          type: object
          properties:
            lastSeq:
              type: integer
              minimum: 0
            bufferSize:
              type: integer
              minimum: 0
            subscribers:
              type: integer
              minimum: 0
          required:
            - lastSeq
            - bufferSize
            - subscribers
        storage:
          type: object
          properties:
            kind:
              type: string
          required:
            - kind
      required:
        - version
        - node
        - uptimeMs
        - startedAt
        - providers
        - events
        - storage
    ProviderCapabilities:
      type: object
      properties:
        list:
          type: boolean
        read:
          type: boolean
        send:
          type: boolean
        steer:
          type: boolean
        queue:
          type: boolean
        create:
          type: boolean
        stream:
          type: boolean
        interrupt:
          type: boolean
        permissions:
          type: boolean
        forms:
          type: boolean
        attachments:
          type: boolean
        attach:
          type: boolean
        files:
          type: boolean
        branches:
          type: boolean
        fork:
          type: boolean
        retry:
          type: boolean
        search:
          type: boolean
        options:
          type: boolean
        markRead:
          type: boolean
        rename:
          type: boolean
      required:
        - list
        - read
        - send
        - steer
        - queue
        - create
        - stream
        - interrupt
        - permissions
        - forms
        - attachments
        - attach
        - files
        - branches
        - fork
        - retry
        - search
        - options
        - markRead
        - rename
    Provider:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        enabled:
          type: boolean
        authKind:
          type: string
          enum:
            - basic
            - bearer
            - none
        authUsername:
          type: string
        status:
          type: string
          enum:
            - online
            - offline
            - auth-error
            - unknown
        version:
          type: string
        lastCheckedAt:
          type: integer
        capabilities:
          type: object
          properties:
            list:
              type: boolean
            read:
              type: boolean
            send:
              type: boolean
            steer:
              type: boolean
            queue:
              type: boolean
            create:
              type: boolean
            stream:
              type: boolean
            interrupt:
              type: boolean
            permissions:
              type: boolean
            forms:
              type: boolean
            attachments:
              type: boolean
            attach:
              type: boolean
            files:
              type: boolean
            branches:
              type: boolean
            fork:
              type: boolean
            retry:
              type: boolean
            search:
              type: boolean
            options:
              type: boolean
            markRead:
              type: boolean
            rename:
              type: boolean
          required:
            - list
            - read
            - send
            - steer
            - queue
            - create
            - stream
            - interrupt
            - permissions
            - forms
            - attachments
            - attach
            - files
            - branches
            - fork
            - retry
            - search
            - options
            - markRead
            - rename
      required:
        - id
        - type
        - name
        - baseUrl
        - enabled
        - status
        - capabilities
    ProviderInput:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9._-]+$
        type:
          type: string
          enum:
            - opencode
            - openwebui
        name:
          type: string
          minLength: 1
          maxLength: 80
        baseUrl:
          type: string
          format: uri
        auth:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - basic
                username:
                  type: string
                  minLength: 1
                  default: opencode
                password:
                  type: string
                  minLength: 1
              required:
                - kind
                - password
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - bearer
                token:
                  type: string
                  minLength: 1
              required:
                - kind
                - token
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - none
              required:
                - kind
        enabled:
          type: boolean
          default: true
      required:
        - id
        - type
        - baseUrl
    ProviderUpdateInput:
      type: object
      properties:
        type:
          type: string
          enum:
            - opencode
            - openwebui
        name:
          type: string
          minLength: 1
          maxLength: 80
        baseUrl:
          type: string
          format: uri
        auth:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - basic
                username:
                  type: string
                  minLength: 1
                  default: opencode
                password:
                  type: string
                  minLength: 1
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - bearer
                token:
                  type: string
                  minLength: 1
              required:
                - kind
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - none
              required:
                - kind
        enabled:
          type: boolean
          default: true
      required:
        - type
        - baseUrl
    ProviderHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - online
            - offline
            - auth-error
            - unknown
        version:
          type: string
        latencyMs:
          type: number
        message:
          type: string
      required:
        - status
    AgentOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
        - id
        - label
    ModelVariant:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
        - id
        - label
    ModelOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        provider:
          type: string
        variants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
            required:
              - id
              - label
      required:
        - id
        - label
    ProviderOptions:
      type: object
      properties:
        agents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
            required:
              - id
              - label
        models:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              provider:
                type: string
              variants:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                  required:
                    - id
                    - label
            required:
              - id
              - label
        directories:
          type: array
          items:
            type: string
        defaults:
          type: object
          properties:
            agent:
              type: string
            model:
              type: string
            directory:
              type: string
      required:
        - agents
        - models
        - directories
    Session:
      type: object
      properties:
        ref:
          type: string
        providerID:
          type: string
          minLength: 1
        nativeID:
          type: string
        title:
          type: string
        project:
          type: string
        directory:
          type: string
        parentRef:
          type: string
        agent:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
            - running
            - idle
            - error
            - offline
        unread:
          type: boolean
        updatedAt:
          type: integer
        createdAt:
          type: integer
        cost:
          type: number
        tokens:
          type: object
          properties:
            input:
              type: integer
              minimum: 0
            output:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        attention:
          type: object
          properties:
            type:
              type: string
              enum:
                - permission
                - approval
                - question
                - unread
                - error
            priority:
              type: string
              enum:
                - blocking
                - high
                - normal
          required:
            - type
            - priority
        nativeUrl:
          type: string
      required:
        - ref
        - providerID
        - nativeID
        - title
        - status
        - unread
        - updatedAt
        - createdAt
    SessionPage:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              ref:
                type: string
              providerID:
                type: string
                minLength: 1
              nativeID:
                type: string
              title:
                type: string
              project:
                type: string
              directory:
                type: string
              parentRef:
                type: string
              agent:
                type: string
              model:
                type: string
              status:
                type: string
                enum:
                  - running
                  - idle
                  - error
                  - offline
              unread:
                type: boolean
              updatedAt:
                type: integer
              createdAt:
                type: integer
              cost:
                type: number
              tokens:
                type: object
                properties:
                  input:
                    type: integer
                    minimum: 0
                  output:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 0
              attention:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - permission
                      - approval
                      - question
                      - unread
                      - error
                  priority:
                    type: string
                    enum:
                      - blocking
                      - high
                      - normal
                required:
                  - type
                  - priority
              nativeUrl:
                type: string
            required:
              - ref
              - providerID
              - nativeID
              - title
              - status
              - unread
              - updatedAt
              - createdAt
        cursor:
          type: object
          properties:
            next:
              type:
                - string
                - "null"
            previous:
              type:
                - string
                - "null"
          required:
            - next
        warnings:
          type: array
          items:
            type: object
            properties:
              providerID:
                type: string
              message:
                type: string
            required:
              - providerID
              - message
      required:
        - data
        - cursor
    CreateSessionInput:
      type: object
      properties:
        providerID:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        directory:
          type: string
        agent:
          type: string
        model:
          type: string
        text:
          type: string
          description: First user message, sent after the session is created
      required:
        - providerID
        - title
    SessionSelectionInput:
      type: object
      properties:
        model:
          type: string
          minLength: 1
        agent:
          type: string
          minLength: 1
    SessionRenameInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - title
    Draft:
      type: object
      properties:
        sessionRef:
          type: string
          minLength: 1
        text:
          type: string
          maxLength: 100000
        updatedAt:
          type: integer
          minimum: 0
      required:
        - sessionRef
        - text
        - updatedAt
    DraftInput:
      type: object
      properties:
        text:
          type: string
          maxLength: 100000
      required:
        - text
    DraftResponse:
      type: object
      properties:
        data:
          type:
            - object
            - "null"
          properties:
            sessionRef:
              type: string
              minLength: 1
            text:
              type: string
              maxLength: 100000
            updatedAt:
              type: integer
              minimum: 0
          required:
            - sessionRef
            - text
            - updatedAt
      required:
        - data
    AssistantView:
      type: object
      properties:
        reply:
          type: object
          properties:
            enabled:
              type: boolean
            baseUrl:
              type: string
            model:
              type: string
            timeoutMs:
              type: integer
            hasApiKey:
              type: boolean
            disableThinking:
              type: boolean
          required:
            - enabled
            - baseUrl
            - model
            - timeoutMs
            - hasApiKey
            - disableThinking
        transcription:
          type: object
          properties:
            enabled:
              type: boolean
            baseUrl:
              type: string
            model:
              type: string
            timeoutMs:
              type: integer
            hasApiKey:
              type: boolean
          required:
            - enabled
            - baseUrl
            - model
            - timeoutMs
            - hasApiKey
      required:
        - reply
        - transcription
    AssistantStatus:
      type: object
      properties:
        enabled:
          type: boolean
        model:
          type: string
        readOnly:
          type: boolean
        canWrite:
          type: boolean
        maxContextMessages:
          type: integer
          minimum: 0
      required:
        - enabled
        - model
        - readOnly
        - canWrite
        - maxContextMessages
    AssistantAction:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - send
            - answer
            - interrupt
        status:
          type: string
          enum:
            - pending
            - deciding
            - done
            - cancelled
            - failed
            - expired
        summary:
          type: string
        sessionRef:
          type: string
          minLength: 1
        text:
          type: string
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: string
                minLength: 1
              choiceId:
                type: string
                minLength: 1
              label:
                type: string
              text:
                type: string
              messageId:
                type: string
                minLength: 1
              revision:
                type: string
                minLength: 1
            required:
              - questionId
              - choiceId
              - label
              - messageId
              - revision
        questions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              text:
                type: string
              risk:
                type: string
                enum:
                  - normal
                  - destructive
                  - sensitive
              choices:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                  required:
                    - id
                    - label
            required:
              - id
              - text
              - risk
              - choices
          maxItems: 3
        error:
          type: string
        createdAt:
          type: integer
          minimum: 0
        decidedAt:
          type: integer
          minimum: 0
      required:
        - id
        - kind
        - status
        - summary
        - sessionRef
        - createdAt
    AssistantActionDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
            - confirm
            - cancel
        text:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - decision
    AssistantThread:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        scope:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - session
                sessionRef:
                  type: string
                  minLength: 1
              required:
                - kind
                - sessionRef
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - project
                project:
                  type: string
                  minLength: 1
              required:
                - kind
                - project
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - global
              required:
                - kind
        title:
          type: string
        createdAt:
          type: integer
          minimum: 0
        updatedAt:
          type: integer
          minimum: 0
        messageCount:
          type: integer
          minimum: 0
      required:
        - id
        - scope
        - title
        - createdAt
        - updatedAt
        - messageCount
    AssistantThreadPage:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              scope:
                oneOf:
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - session
                      sessionRef:
                        type: string
                        minLength: 1
                    required:
                      - kind
                      - sessionRef
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - project
                      project:
                        type: string
                        minLength: 1
                    required:
                      - kind
                      - project
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - global
                    required:
                      - kind
              title:
                type: string
              createdAt:
                type: integer
                minimum: 0
              updatedAt:
                type: integer
                minimum: 0
              messageCount:
                type: integer
                minimum: 0
            required:
              - id
              - scope
              - title
              - createdAt
              - updatedAt
              - messageCount
      required:
        - data
    AssistantThreadDetail:
      type: object
      properties:
        thread:
          type: object
          properties:
            id:
              type: string
              minLength: 1
            scope:
              oneOf:
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - session
                    sessionRef:
                      type: string
                      minLength: 1
                  required:
                    - kind
                    - sessionRef
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - project
                    project:
                      type: string
                      minLength: 1
                  required:
                    - kind
                    - project
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - global
                  required:
                    - kind
            title:
              type: string
            createdAt:
              type: integer
              minimum: 0
            updatedAt:
              type: integer
              minimum: 0
            messageCount:
              type: integer
              minimum: 0
          required:
            - id
            - scope
            - title
            - createdAt
            - updatedAt
            - messageCount
        turns:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              threadId:
                type: string
                minLength: 1
              role:
                type: string
                enum:
                  - user
                  - assistant
              text:
                type: string
              createdAt:
                type: integer
                minimum: 0
              runId:
                type: string
              model:
                type: string
              error:
                type: string
              action:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  kind:
                    type: string
                    enum:
                      - send
                      - answer
                      - interrupt
                  status:
                    type: string
                    enum:
                      - pending
                      - deciding
                      - done
                      - cancelled
                      - failed
                      - expired
                  summary:
                    type: string
                  sessionRef:
                    type: string
                    minLength: 1
                  text:
                    type: string
                  answers:
                    type: array
                    items:
                      type: object
                      properties:
                        questionId:
                          type: string
                          minLength: 1
                        choiceId:
                          type: string
                          minLength: 1
                        label:
                          type: string
                        text:
                          type: string
                        messageId:
                          type: string
                          minLength: 1
                        revision:
                          type: string
                          minLength: 1
                      required:
                        - questionId
                        - choiceId
                        - label
                        - messageId
                        - revision
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        text:
                          type: string
                        risk:
                          type: string
                          enum:
                            - normal
                            - destructive
                            - sensitive
                        choices:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              label:
                                type: string
                            required:
                              - id
                              - label
                      required:
                        - id
                        - text
                        - risk
                        - choices
                    maxItems: 3
                  error:
                    type: string
                  createdAt:
                    type: integer
                    minimum: 0
                  decidedAt:
                    type: integer
                    minimum: 0
                required:
                  - id
