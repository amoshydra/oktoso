openapi: 3.1.0
info:
  title: Agent Hub API
  version: 0.2.0
  description: Hub API for sessions, messages, attention, provider options, diagnostics, and a resumable event stream.
servers:
  - url: http://127.0.0.1:8787
    description: Local hub
tags:
  - name: health
  - name: auth
  - name: providers
  - name: sessions
  - name: attention
  - name: events
  - name: search
  - name: diagnostics
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            requestId:
              type: string
            details:
              type: object
              additionalProperties: {}
          required:
            - code
            - message
            - retryable
      required:
        - error
    Cursor:
      type: object
      properties:
        next:
          type:
            - string
            - "null"
        previous:
          type:
            - string
            - "null"
      required:
        - next
    Health:
      type: object
      properties:
        ok:
          type: boolean
        version:
          type: string
        uptimeMs:
          type: integer
          minimum: 0
        startedAt:
          type: integer
        eventSeq:
          type: integer
          minimum: 0
      required:
        - ok
        - version
        - uptimeMs
        - startedAt
        - eventSeq
    AuthCheck:
      type: object
      properties:
        ok:
          type: boolean
        version:
          type: string
      required:
        - ok
        - version
    Diagnostics:
      type: object
      properties:
        version:
          type: string
        node:
          type: string
        uptimeMs:
          type: integer
          minimum: 0
        startedAt:
          type: integer
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              type:
                type: string
              status:
                type: string
                enum:
                  - online
                  - offline
                  - auth-error
                  - unknown
              lastCheckedAt:
                type: integer
              lastSyncAt:
                type: integer
              lastError:
                type: string
              nextRetryAt:
                type: integer
            required:
              - id
              - type
              - status
        events:
          type: object
          properties:
            lastSeq:
              type: integer
              minimum: 0
            bufferSize:
              type: integer
              minimum: 0
            subscribers:
              type: integer
              minimum: 0
          required:
            - lastSeq
            - bufferSize
            - subscribers
        storage:
          type: object
          properties:
            kind:
              type: string
          required:
            - kind
      required:
        - version
        - node
        - uptimeMs
        - startedAt
        - providers
        - events
        - storage
    ProviderCapabilities:
      type: object
      properties:
        list:
          type: boolean
        read:
          type: boolean
        send:
          type: boolean
        create:
          type: boolean
        stream:
          type: boolean
        interrupt:
          type: boolean
        permissions:
          type: boolean
        forms:
          type: boolean
        attachments:
          type: boolean
        search:
          type: boolean
        options:
          type: boolean
        markRead:
          type: boolean
      required:
        - list
        - read
        - send
        - create
        - stream
        - interrupt
        - permissions
        - forms
        - attachments
        - search
        - options
        - markRead
    Provider:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        enabled:
          type: boolean
        status:
          type: string
          enum:
            - online
            - offline
            - auth-error
            - unknown
        version:
          type: string
        lastCheckedAt:
          type: integer
        capabilities:
          type: object
          properties:
            list:
              type: boolean
            read:
              type: boolean
            send:
              type: boolean
            create:
              type: boolean
            stream:
              type: boolean
            interrupt:
              type: boolean
            permissions:
              type: boolean
            forms:
              type: boolean
            attachments:
              type: boolean
            search:
              type: boolean
            options:
              type: boolean
            markRead:
              type: boolean
          required:
            - list
            - read
            - send
            - create
            - stream
            - interrupt
            - permissions
            - forms
            - attachments
            - search
            - options
            - markRead
      required:
        - id
        - type
        - name
        - baseUrl
        - enabled
        - status
        - capabilities
    ProviderHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - online
            - offline
            - auth-error
            - unknown
        version:
          type: string
        latencyMs:
          type: number
        message:
          type: string
      required:
        - status
    AgentOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
        - id
        - label
    ModelOption:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        provider:
          type: string
      required:
        - id
        - label
    ProviderOptions:
      type: object
      properties:
        agents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
            required:
              - id
              - label
        models:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              provider:
                type: string
            required:
              - id
              - label
        directories:
          type: array
          items:
            type: string
        defaults:
          type: object
          properties:
            agent:
              type: string
            model:
              type: string
            directory:
              type: string
      required:
        - agents
        - models
        - directories
    Session:
      type: object
      properties:
        ref:
          type: string
        providerID:
          type: string
          minLength: 1
        nativeID:
          type: string
        title:
          type: string
        project:
          type: string
        directory:
          type: string
        parentRef:
          type: string
        agent:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
            - running
            - idle
            - error
            - offline
        unread:
          type: boolean
        updatedAt:
          type: integer
        createdAt:
          type: integer
        cost:
          type: number
        tokens:
          type: object
          properties:
            input:
              type: integer
              minimum: 0
            output:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        attention:
          type: object
          properties:
            type:
              type: string
              enum:
                - permission
                - approval
                - question
                - unread
                - error
            priority:
              type: string
              enum:
                - blocking
                - high
                - normal
          required:
            - type
            - priority
        nativeUrl:
          type: string
      required:
        - ref
        - providerID
        - nativeID
        - title
        - status
        - unread
        - updatedAt
        - createdAt
    SessionPage:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              ref:
                type: string
              providerID:
                type: string
                minLength: 1
              nativeID:
                type: string
              title:
                type: string
              project:
                type: string
              directory:
                type: string
              parentRef:
                type: string
              agent:
                type: string
              model:
                type: string
              status:
                type: string
                enum:
                  - running
                  - idle
                  - error
                  - offline
              unread:
                type: boolean
              updatedAt:
                type: integer
              createdAt:
                type: integer
              cost:
                type: number
              tokens:
                type: object
                properties:
                  input:
                    type: integer
                    minimum: 0
                  output:
                    type: integer
                    minimum: 0
                  total:
                    type: integer
                    minimum: 0
              attention:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - permission
                      - approval
                      - question
                      - unread
                      - error
                  priority:
                    type: string
                    enum:
                      - blocking
                      - high
                      - normal
                required:
                  - type
                  - priority
              nativeUrl:
                type: string
            required:
              - ref
              - providerID
              - nativeID
              - title
              - status
              - unread
              - updatedAt
              - createdAt
        cursor:
          type: object
          properties:
            next:
              type:
                - string
                - "null"
            previous:
              type:
                - string
                - "null"
          required:
            - next
      required:
        - data
        - cursor
    CreateSessionInput:
      type: object
      properties:
        providerID:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        directory:
          type: string
        agent:
          type: string
        model:
          type: string
        text:
          type: string
      required:
        - providerID
        - title
    MessagePart:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - text
            text:
              type: string
          required:
            - type
            - text
        - type: object
          properties:
            type:
              type: string
              enum:
                - reasoning
            text:
              type: string
          required:
            - type
            - text
        - type: object
          properties:
            type:
              type: string
              enum:
                - tool
            id:
              type: string
            name:
              type: string
            status:
              type: string
            input: {}
            output: {}
          required:
            - type
            - id
            - name
            - status
        - type: object
          properties:
            type:
              type: string
              enum:
                - file
            name:
              type: string
            mimeType:
              type: string
            url:
              type: string
          required:
            - type
            - name
        - type: object
          properties:
            type:
              type: string
              enum:
                - unknown
            raw: {}
          required:
            - type
    Message:
      type: object
      properties:
        id:
          type: string
        sessionRef:
          type: string
        role:
          type: string
          enum:
            - user
            - assistant
            - system
            - tool
        parts:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - text
                  text:
                    type: string
                required:
                  - type
                  - text
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - reasoning
                  text:
                    type: string
                required:
                  - type
                  - text
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - tool
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                  input: {}
                  output: {}
                required:
                  - type
                  - id
                  - name
                  - status
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - file
                  name:
                    type: string
                  mimeType:
                    type: string
                  url:
                    type: string
                required:
                  - type
                  - name
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                      - unknown
                  raw: {}
                required:
                  - type
        createdAt:
          type: integer
        completedAt:
          type: integer
        streaming:
          type: boolean
        metadata:
          type: object
          additionalProperties: {}
      required:
        - id
        - sessionRef
        - role
        - parts
        - createdAt
    MessagePage:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              sessionRef:
                type: string
              role:
                type: string
                enum:
                  - user
                  - assistant
                  - system
                  - tool
              parts:
                type: array
                items:
                  oneOf:
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - text
                        text:
                          type: string
                      required:
                        - type
                        - text
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - reasoning
                        text:
                          type: string
                      required:
                        - type
                        - text
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - tool
                        id:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        input: {}
                        output: {}
                      required:
                        - type
                        - id
                        - name
                        - status
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - file
                        name:
                          type: string
                        mimeType:
                          type: string
                        url:
                          type: string
                      required:
                        - type
                        - name
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - unknown
                        raw: {}
                      required:
                        - type
              createdAt:
                type: integer
              completedAt:
                type: integer
              streaming:
                type: boolean
              metadata:
                type: object
                additionalProperties: {}
            required:
              - id
              - sessionRef
              - role
              - parts
              - createdAt
        cursor:
          type: object
          properties:
            next:
              type:
                - string
                - "null"
            previous:
              type:
                - string
                - "null"
          required:
            - next
      required:
        - data
        - cursor
    SendInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
        - text
    SendResult:
      type: object
      properties:
        accepted:
          type: boolean
        messageID:
          type: string
      required:
        - accepted
    AttentionType:
      type: string
      enum:
        - permission
        - approval
        - question
        - unread
        - error
    AttentionPriority:
      type: string
      enum:
        - blocking
        - high
        - normal
    AttentionAction:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        style:
          type: string
          enum:
            - primary
            - danger
            - default
      required:
        - id
        - label
    AttentionField:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            - text
            - textarea
            - number
            - boolean
            - select
            - multiselect
        required:
          type: boolean
        placeholder:
          type: string
        description:
          type: string
        defaultValue: {}
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
            required:
              - value
              - label
      required:
        - id
        - label
        - type
    Attention:
      type: object
      properties:
        id:
          type: string
        sessionRef:
          type: string
        type:
          type: string
          enum:
            - permission
            - approval
            - question
            - unread
            - error
        priority:
          type: string
          enum:
            - blocking
            - high
            - normal
        title:
          type: string
        summary:
          type: string
        createdAt:
          type: integer
        actions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              style:
                type: string
                enum:
                  - primary
                  - danger
                  - default
            required:
              - id
              - label
        fields:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              type:
                type: string
                enum:
                  - text
                  - textarea
                  - number
                  - boolean
                  - select
                  - multiselect
              required:
                type: boolean
              placeholder:
                type: string
              description:
                type: string
              defaultValue: {}
              options:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                    label:
                      type: string
                  required:
                    - value
                    - label
            required:
              - id
              - label
              - type
        openInProviderUrl:
          type: string
        payload: {}
      required:
        - id
        - sessionRef
        - type
        - priority
        - title
        - summary
        - createdAt
        - actions
    AttentionPage:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              sessionRef:
                type: string
              type:
                type: string
                enum:
                  - permission
                  - approval
                  - question
                  - unread
                  - error
              priority:
                type: string
                enum:
                  - blocking
                  - high
                  - normal
              title:
                type: string
              summary:
                type: string
              createdAt:
                type: integer
              actions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    style:
                      type: string
                      enum:
                        - primary
                        - danger
                        - default
                  required:
                    - id
                    - label
              fields:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    type:
                      type: string
                      enum:
                        - text
                        - textarea
                        - number
                        - boolean
                        - select
                        - multiselect
                    required:
                      type: boolean
                    placeholder:
                      type: string
                    description:
                      type: string
                    defaultValue: {}
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          value:
                            type: string
                          label:
                            type: string
                        required:
                          - value
                          - label
                  required:
                    - id
                    - label
                    - type
              openInProviderUrl:
                type: string
              payload: {}
            required:
              - id
              - sessionRef
              - type
              - priority
              - title
              - summary
              - createdAt
              - actions
      required:
        - data
    AttentionActionInput:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: {}
        payload: {}
    AttentionSummary:
      type: object
      properties:
        type:
          type: string
          enum:
            - permission
            - approval
            - question
            - unread
            - error
        priority:
          type: string
          enum:
            - blocking
            - high
            - normal
      required:
        - type
        - priority
    HubEvent:
      type: object
      properties:
        seq:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
            - session.created
            - session.updated
            - session.deleted
            - session.read
            - message.created
            - message.updated
            - message.delta
            - attention.created
            - attention.updated
            - attention.resolved
            - provider.status
            - error
            - resync
        sessionRef:
          type: string
        attentionID:
          type: string
        data: {}
        at:
          type: integer
      required:
        - seq
        - type
        - at
    SearchResult:
      type: object
      properties:
        ref:
          type: string
        title:
          type: string
        providerID:
          type: string
        project:
          type: string
        directory:
          type: string
        updatedAt:
          type: integer
        snippet:
          type: string
      required:
        - ref
        - title
        - providerID
        - updatedAt
  parameters: {}
paths:
  /api/v1/health:
    get:
      tags:
        - health
      summary: Hub liveness
      security: []
      responses:
        "200":
          description: Hub is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/check:
    get:
      tags:
        - auth
      summary: Check the hub bearer token
      responses:
        "200":
          description: Token accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCheck"
        "401":
          description: Missing or invalid hub token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/providers:
    get:
      tags:
        - providers
      summary: List configured providers
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
                required:
                  - data
  /api/v1/providers/{providerID}/check:
    post:
      tags:
        - providers
      summary: Check provider health
      parameters:
        - schema:
            type: string
          required: true
          name: providerID
          in: path
      responses:
        "200":
          description: Health result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealth"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/providers/{providerID}/options:
    get:
      tags:
        - providers
      summary: List provider creation options
      parameters:
        - schema:
            type: string
          required: true
          name: providerID
          in: path
      responses:
        "200":
          description: Provider options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderOptions"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider does not expose options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sessions:
    get:
      tags:
        - sessions
      summary: List sessions across providers
      parameters:
        - schema:
            type: string
          required: false
          name: provider
          in: query
        - schema:
            type: string
            enum:
              - running
              - idle
              - error
              - offline
          required: false
          name: status
          in: query
        - schema:
            type: string
          required: false
          name: q
          in: query
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 200
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Session page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - sessions
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sessions/{ref}:
    get:
      tags:
        - sessions
      summary: Get one session
      parameters:
        - schema:
            type: string
          required: true
          name: ref
