                  - data
  /api/v1/automation:
    get:
      tags:
        - automation
      summary: Read automation watchers, templates, runs, and approvals
      responses:
        "200":
          description: Automation view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AutomationView"
                required:
                  - data
    put:
      tags:
        - automation
      summary: Pause, resume, or toggle dry-run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationSettingsInput"
      responses:
        "200":
          description: Updated automation view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AutomationView"
                required:
                  - data
        "400":
          description: Invalid automation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/automation/templates/{id}/start:
    post:
      tags:
        - automation
      summary: Start a configured template
      description: "A human action: it ignores pause, dry run, budgets, and quiet hours, and records no automation run. Returns the session object directly, like `POST /api/v1/sessions`."
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: id
          in: path
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Unknown template or provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Provider cannot create or send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/automation/watchers/{id}/pause:
    post:
      tags:
        - automation
      summary: Pause or resume one watcher
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paused:
                  type: boolean
              required:
                - paused
      responses:
        "200":
          description: Updated automation view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AutomationView"
                required:
                  - data
        "404":
          description: Watcher not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/automation/runs:
    get:
      tags:
        - automation
      summary: Read recent automation runs
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 200
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Automation runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRunPage"
  /api/v1/automation/approvals:
    get:
      tags:
        - automation
      summary: List pending approvals
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationApprovalPage"
  /api/v1/automation/shapes/{id}:
    delete:
      tags:
        - automation
      summary: Revoke a remembered automation shape
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Allowed shape revoked
        "404":
          description: Allowed shape not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/automation/approvals/{id}/{action}:
    post:
      tags:
        - automation
      summary: Approve or deny a queued automation action
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            $ref: "#/components/schemas/AutomationApprovalAction"
          required: true
          name: action
          in: path
      responses:
        "204":
          description: Approval decided
        "404":
          description: Approval not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Approval expired, already decided, or the question changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assistant/status:
    get:
      tags:
        - assistant
      summary: Hub assistant availability
      description: Reports whether the assistant has a model configured. M1 is read-only and session-scoped.
      responses:
        "200":
          description: Assistant status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantStatus"
  /api/v1/assistant/threads:
    post:
      tags:
        - assistant
      summary: Open the session assistant thread
      description: Returns the existing thread for this scope or creates one. M1 supports the session scope only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantThreadInput"
      responses:
        "201":
          description: Thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantThread"
        "400":
          description: Invalid scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The assistant is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - assistant
      summary: List assistant threads
      parameters:
        - schema:
            type: string
          required: false
          name: sessionRef
          in: query
      responses:
        "200":
          description: Threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantThreadPage"
  /api/v1/assistant/threads/{id}:
    get:
      tags:
        - assistant
      summary: Read a thread with its turns
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Thread detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantThreadDetail"
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - assistant
      summary: Delete a thread
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Thread deleted
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assistant/threads/{id}/messages:
    post:
      tags:
        - assistant
      summary: Ask a question
      description: Appends the user turn and starts one read-only answer. The run streams on /api/v1/assistant/runs/{id}/events.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageInput"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantRunAccepted"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A run is already in flight for this thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assistant/threads/{id}/turns/{turnId}/action:
    post:
      tags:
        - assistant
      summary: Confirm or cancel a proposed action
      description: The only path that writes to a provider. `confirm` sends, answers, or interrupts; `cancel` records the decision and does nothing. Write actions are disabled unless assistant.allowWrite is on.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
          required: true
          name: turnId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantActionDecision"
      responses:
        "200":
          description: Updated turn
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  threadId:
                    type: string
                    minLength: 1
                  role:
                    type: string
                    enum:
                      - user
                      - assistant
                  text:
                    type: string
                  createdAt:
                    type: integer
                    minimum: 0
                  runId:
                    type: string
                  model:
                    type: string
                  error:
                    type: string
                  action:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      kind:
                        type: string
                        enum:
                          - send
                          - answer
                          - interrupt
                      status:
                        type: string
                        enum:
                          - pending
                          - deciding
                          - done
                          - cancelled
                          - failed
                          - expired
                      summary:
                        type: string
                      sessionRef:
                        type: string
                        minLength: 1
                      text:
                        type: string
                      answers:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId:
                              type: string
                              minLength: 1
                            choiceId:
                              type: string
                              minLength: 1
                            label:
                              type: string
                            text:
                              type: string
                            messageId:
                              type: string
                              minLength: 1
                            revision:
                              type: string
                              minLength: 1
                          required:
                            - questionId
                            - choiceId
                            - label
                            - messageId
                            - revision
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 1
                            text:
                              type: string
                            risk:
                              type: string
                              enum:
                                - normal
                                - destructive
                                - sensitive
                            choices:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  label:
                                    type: string
                                required:
                                  - id
                                  - label
                          required:
                            - id
                            - text
                            - risk
                            - choices
                        maxItems: 3
                      error:
                        type: string
                      createdAt:
                        type: integer
                        minimum: 0
                      decidedAt:
                        type: integer
                        minimum: 0
                    required:
                      - id
                      - kind
                      - status
                      - summary
                      - sessionRef
                      - createdAt
                  context:
                    type: object
                    properties:
                      messages:
                        type: integer
                        minimum: 0
                      omitted:
                        type: integer
                        minimum: 0
                      chars:
                        type: integer
                        minimum: 0
                      attention:
                        type: integer
                        minimum: 0
                      asOf:
                        type: integer
                        minimum: 0
                      failures:
                        type: integer
                        minimum: 0
                      historyAt:
                        type: integer
                        minimum: 0
                      sessions:
                        type: integer
                        minimum: 0
                      scope:
                        type: string
                        enum:
                          - session
                          - project
                          - global
                      running:
                        type: integer
                        minimum: 0
                  usage:
                    type: object
                    properties:
                      promptTokens:
                        type: integer
                        minimum: 0
                      completionTokens:
                        type: integer
                        minimum: 0
                    required:
                      - promptTokens
                      - completionTokens
                required:
                  - id
                  - threadId
                  - role
                  - text
                  - createdAt
        "400":
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Turn or action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Writes are disabled or the action was already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assistant/runs/{id}/stop:
    post:
      tags:
        - assistant
      summary: Stop an answer
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/assistant/runs/{id}/events:
    get:
      tags:
        - assistant
      summary: Follow an answer
      description: "Server-sent events: delta frames carry text, and exactly one done or error frame ends the stream. Replay with ?since=<index>."
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
          required: false
          name: since
          in: query
      responses:
        "200":
          description: Assistant run events
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AssistantEvent"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
webhooks: {}
